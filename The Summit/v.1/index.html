<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2c3550">
<title>The Climb — 1-on-1 Quest</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html{height:100%;overscroll-behavior:none;color-scheme:light;}
  body{
    font-family:'Avenir Next','Avenir','Seravek','Gill Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#fbf7ee;min-height:100dvh;height:100%;overflow-x:hidden;position:relative;
    display:flex;flex-direction:column;touch-action:manipulation;overscroll-behavior:none;
  }
  .serif{font-family:'Iowan Old Style','Palatino Linotype','Palatino','Charter','Georgia',serif;}

  /* ================= SCENE ================= */
  .scene,.stars,.orb,.cloudband,.birds,.mist,.flies,.shootwrap,.firewrap,.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .mtn{position:fixed;left:-10%;bottom:0;width:120%;z-index:0;pointer-events:none;}
  .layer{position:fixed;inset:0;opacity:0;transition:opacity 1.3s ease;z-index:0;}
  .layer.active{opacity:1;}
  .l0{background:linear-gradient(180deg,#dfe0d8 0%,#f0e3c2 45%,#f4d9a6 78%,#e8cd9a 100%);}
  .l1{background:linear-gradient(180deg,#cfdcb6 0%,#ece1b0 65%,#e3d199 100%);}
  .l2{background:linear-gradient(180deg,#b6cea0 0%,#dfd89c 70%,#d8c889 100%);}
  .l3{background:linear-gradient(180deg,#a3c4af 0%,#d6cf8c 70%,#d0bf7e 100%);}
  .l4{background:linear-gradient(180deg,#cdb87f 0%,#e6bd72 65%,#dd9f57 100%);}
  .l5{background:linear-gradient(180deg,#dd9a4e 0%,#e9c06a 55%,#e0a14c 100%);}
  .l6{background:linear-gradient(180deg,#473a66 0%,#8a5560 45%,#c97a4e 80%,#dd8a52 100%);}
  .l7{background:linear-gradient(180deg,#141b33 0%,#27294a 55%,#4a3a58 100%);}

  /* stars */
  .stars{opacity:0;transition:opacity 1.6s ease;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 18%,#fff,transparent),
      radial-gradient(1.4px 1.4px at 28% 9%,#fff,transparent),
      radial-gradient(1.8px 1.8px at 44% 22%,#fff,transparent),
      radial-gradient(1.3px 1.3px at 61% 12%,#fff,transparent),
      radial-gradient(1.7px 1.7px at 73% 26%,#fff,transparent),
      radial-gradient(1.4px 1.4px at 86% 14%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 20% 34%,#fff,transparent),
      radial-gradient(1.3px 1.3px at 52% 38%,#fff,transparent),
      radial-gradient(1.6px 1.6px at 90% 40%,#fff,transparent),
      radial-gradient(1.2px 1.2px at 8% 45%,#fff,transparent),
      radial-gradient(1.2px 1.2px at 67% 44%,#fff,transparent),
      radial-gradient(1.4px 1.4px at 36% 6%,#fff,transparent);
    animation:twinkle 5s ease-in-out infinite alternate;}
  @keyframes twinkle{from{filter:brightness(.85)}to{filter:brightness(1.2)}}
  body.dim-stars .stars{opacity:.35;}
  body.full-stars .stars{opacity:1;}

  /* shooting star */
  .shoot{position:fixed;top:6%;left:0;width:90px;height:2px;opacity:0;
    background:linear-gradient(90deg,transparent,#fff);border-radius:2px;
    transform:rotate(32deg);}
  body.full-stars .shoot{animation:shoot 9s ease-in 3s infinite;}
  @keyframes shoot{
    0%{opacity:0;transform:translate(105vw,0) rotate(32deg);}
    3%{opacity:.9;}
    9%{opacity:0;transform:translate(55vw,28vh) rotate(32deg);}
    100%{opacity:0;transform:translate(55vw,28vh) rotate(32deg);}
  }

  /* sun / moon */
  .orb .ball{position:absolute;width:80px;height:80px;border-radius:50%;left:8%;top:64%;
    background:radial-gradient(circle at 35% 35%,#fff7e0,#ffd98a);
    box-shadow:0 0 60px 18px rgba(255,216,120,.55);
    transition:left 1.4s cubic-bezier(.4,.1,.2,1),top 1.4s cubic-bezier(.4,.1,.2,1),
      width 1.4s ease,height 1.4s ease,background 1.4s ease,box-shadow 1.4s ease;}
  body.stage-0 .ball{left:6%;top:66%;}
  body.stage-1 .ball{left:18%;top:40%;}
  body.stage-2 .ball{left:34%;top:22%;}
  body.stage-3 .ball{left:50%;top:14%;}
  body.stage-4 .ball{left:66%;top:24%;background:radial-gradient(circle at 35% 35%,#fff2cf,#ffc066);box-shadow:0 0 70px 22px rgba(255,170,80,.55);}
  body.stage-5 .ball{left:80%;top:46%;width:96px;height:96px;background:radial-gradient(circle at 40% 40%,#ffd9a0,#f08a3c);box-shadow:0 0 90px 30px rgba(240,130,50,.5);}
  body.stage-6 .ball{left:88%;top:72%;width:84px;height:84px;background:radial-gradient(circle at 40% 40%,#ffcf9e,#d9622f);box-shadow:0 0 80px 26px rgba(200,80,40,.45);}
  body.stage-7 .ball{left:74%;top:12%;width:62px;height:62px;background:radial-gradient(circle at 38% 36%,#fdfbf0,#cfd4e6);box-shadow:0 0 46px 12px rgba(220,228,255,.45);}

  /* clouds */
  .cloud{position:fixed;height:26px;border-radius:30px;background:rgba(255,255,255,.7);
    filter:blur(1.5px);opacity:var(--cloud-op,.7);transition:opacity 1.4s ease;}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%;}
  .cloud::before{width:34px;height:34px;top:-16px;left:18%;}
  .cloud::after{width:24px;height:24px;top:-10px;left:52%;}
  .c1{width:120px;top:9%;animation:drift 110s linear infinite;}
  .c2{width:86px;top:17%;animation:drift 150s linear infinite;animation-delay:-60s;}
  .c3{width:150px;top:5%;animation:drift 180s linear infinite;animation-delay:-120s;opacity:calc(var(--cloud-op,.7)*.6);}
  @keyframes drift{from{transform:translateX(-160px);}to{transform:translateX(110vw);}}
  body{--cloud-op:.75;}
  body.stage-5{--cloud-op:.45;}
  body.stage-6{--cloud-op:.25;}
  body.stage-7{--cloud-op:.07;}

  /* birds */
  .birds{opacity:0;transition:opacity 1.2s;}
  body.stage-1 .birds,body.stage-2 .birds,body.stage-3 .birds,body.stage-4 .birds{opacity:.85;}
  .bird{position:fixed;left:0;top:20%;animation:flyby 36s linear infinite;}
  .bird svg{width:22px;height:9px;}
  .bird.b2{top:24%;animation-delay:-14s;animation-duration:44s;transform:scale(.7);}
  .bird.b3{top:16%;animation-delay:-27s;animation-duration:52s;transform:scale(.55);}
  @keyframes flyby{
    0%{transform:translate(-6vw,0);}
    25%{transform:translate(22vw,-2vh);}
    50%{transform:translate(50vw,1vh);}
    75%{transform:translate(78vw,-2.5vh);}
    100%{transform:translate(108vw,0);}
  }
  .bird path{stroke:rgba(40,48,40,.65);stroke-width:1.6;fill:none;stroke-linecap:round;}

  /* mist (dawn) */
  .mist{opacity:0;transition:opacity 1.5s;
    background:linear-gradient(180deg,transparent 55%,rgba(255,255,255,.34) 72%,rgba(255,255,255,.12) 88%,transparent 100%);}
  body.stage-0 .mist{opacity:1;}
  body.stage-1 .mist{opacity:.45;}

  /* fireflies (dusk) */
  .flies{opacity:0;transition:opacity 1.5s;}
  body.stage-5 .flies,body.stage-6 .flies{opacity:1;}
  .fly{position:fixed;width:4px;height:4px;border-radius:50%;background:#ffe9a3;
    box-shadow:0 0 8px 3px rgba(255,233,140,.7);animation:hoverfly 7s ease-in-out infinite alternate,blink 2.3s ease-in-out infinite;}
  .fly:nth-child(1){left:14%;top:62%;}
  .fly:nth-child(2){left:30%;top:70%;animation-delay:-2s,-1s;}
  .fly:nth-child(3){left:58%;top:66%;animation-delay:-4s,-.4s;}
  .fly:nth-child(4){left:76%;top:72%;animation-delay:-1s,-1.7s;}
  .fly:nth-child(5){left:44%;top:75%;animation-delay:-5s,-.9s;}
  @keyframes hoverfly{from{transform:translate(0,0);}to{transform:translate(26px,-34px);}}
  @keyframes blink{0%,100%{opacity:.15;}50%{opacity:1;}}

  /* mountains parallax layers */
  .mtn svg{position:absolute;bottom:0;left:0;width:100%;height:auto;display:block;}
  .mtn{transition:transform 1.4s cubic-bezier(.4,.1,.2,1);}
  .mtn-far path{fill:var(--mtn-far);transition:fill 1.3s ease;}
  .mtn-mid path{fill:var(--mtn-mid);transition:fill 1.3s ease;}
  .mtn-near path{fill:var(--mtn-near);transition:fill 1.3s ease;}
  .mtn-trees path{fill:var(--trees);transition:fill 1.3s ease;}
  body{--mtn-far:#aab694;--mtn-mid:#8ca37a;--mtn-near:#6f8a5e;--trees:#59734c;}
  body.stage-1{--mtn-far:#9fb58a;--mtn-mid:#80a06c;--mtn-near:#5f7d54;--trees:#4d6a44;}
  body.stage-2{--mtn-far:#8fae84;--mtn-mid:#6f9663;--mtn-near:#54724b;--trees:#44603c;}
  body.stage-3{--mtn-far:#8aa97f;--mtn-mid:#6a9160;--mtn-near:#4f6f48;--trees:#405c39;}
  body.stage-4{--mtn-far:#a98e60;--mtn-mid:#8a6c42;--mtn-near:#6d4f2c;--trees:#5a401f;}
  body.stage-5{--mtn-far:#a96f3d;--mtn-mid:#8a532a;--mtn-near:#66391a;--trees:#532e12;}
  body.stage-6{--mtn-far:#6b4a60;--mtn-mid:#4d3147;--mtn-near:#332034;--trees:#271826;}
  body.stage-7{--mtn-far:#2c3450;--mtn-mid:#20263d;--mtn-near:#141a2c;--trees:#0e1322;}

  /* campfire */
  .firewrap{opacity:0;transition:opacity 1s;}
  body.mode-campfire .firewrap{opacity:1;}
  .fireglow{position:fixed;left:50%;bottom:-4%;width:120vw;height:46vh;transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 100%,rgba(255,150,60,.34),transparent 65%);
    animation:glowpulse 2.6s ease-in-out infinite alternate;}
  @keyframes glowpulse{from{opacity:.7;}to{opacity:1;}}
  .fire{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);width:70px;height:80px;}
  .log{position:absolute;bottom:0;left:50%;width:64px;height:9px;border-radius:5px;background:#4a2e18;}
  .log.lg1{transform:translateX(-50%) rotate(14deg);}
  .log.lg2{transform:translateX(-50%) rotate(-12deg);background:#3c2412;}
  .flame{position:absolute;bottom:6px;left:50%;border-radius:50% 50% 38% 38%/62% 62% 38% 38%;
    transform-origin:50% 100%;}
  .f1{width:34px;height:52px;margin-left:-17px;background:radial-gradient(circle at 50% 80%,#ffdf8a,#f5953c 60%,#d9622f);
    animation:flick .42s ease-in-out infinite alternate;}
  .f2{width:20px;height:34px;margin-left:-10px;background:radial-gradient(circle at 50% 80%,#fff3c0,#ffc257);
    animation:flick .33s ease-in-out infinite alternate-reverse;}
  @keyframes flick{from{transform:scaleY(1) scaleX(1) rotate(-2deg);}to{transform:scaleY(1.14) scaleX(.92) rotate(2.5deg);}}
  .spark{position:absolute;bottom:40px;left:50%;width:3px;height:3px;border-radius:50%;background:#ffd98a;
    animation:rise 2.8s ease-in infinite;}
  .spark.s2{animation-delay:-1.1s;margin-left:8px;}
  .spark.s3{animation-delay:-2s;margin-left:-9px;}
  @keyframes rise{0%{opacity:0;transform:translateY(0);}12%{opacity:1;}100%{opacity:0;transform:translateY(-90px) translateX(10px);}}

  /* vignette */
  .vignette{background:radial-gradient(ellipse at 50% 38%,transparent 52%,rgba(8,10,22,.42) 100%);
    opacity:.14;transition:opacity 1.4s;}
  body.stage-6 .vignette{opacity:.4;}
  body.stage-7 .vignette{opacity:.55;}

  /* legibility scrims — keep text readable no matter where the sun/moon sits */
  .scrim-top,.scrim-bot{position:fixed;left:0;right:0;z-index:2;pointer-events:none;}
  .scrim-top{top:0;height:30%;
    background:linear-gradient(180deg,rgba(22,26,16,.5) 0%,rgba(22,26,16,.3) 50%,transparent 100%);}
  .scrim-bot{bottom:0;height:22%;
    background:linear-gradient(0deg,rgba(22,26,16,.46) 0%,rgba(22,26,16,.2) 55%,transparent 100%);}

  /* ================= SCREENS ================= */
  .screen{display:none;flex-direction:column;flex:1;min-height:0;z-index:3;position:relative;}
  .screen.active{display:flex;}

  /* ---- menu ---- */
  #menu{align-items:center;justify-content:center;padding:22px 22px calc(26px + env(safe-area-inset-bottom));overflow-y:auto;}
  .menu-inner{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;}
  .title-emblem{width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,217,138,.8);
    display:flex;align-items:center;justify-content:center;background:rgba(20,28,20,.22);margin-bottom:14px;
    line-height:0;box-shadow:0 6px 22px rgba(0,0,0,.25);}
  .title-emblem svg{width:42px;height:42px;display:block;}
  #menu h1{font-size:2.3rem;letter-spacing:4px;font-weight:700;text-transform:uppercase;
    text-shadow:0 2px 10px rgba(0,0,0,.35);}
  #menu .tagline{font-size:.84rem;opacity:.92;margin:6px 0 22px;font-weight:600;letter-spacing:.5px;text-shadow:0 1px 4px rgba(0,0,0,.3);}
  .mode-card{width:100%;display:flex;align-items:center;gap:14px;text-align:left;
    background:rgba(22,30,22,.34);border:1.5px solid rgba(255,217,138,.4);border-radius:18px;
    padding:15px 17px;margin-bottom:11px;color:#fbf7ee;cursor:pointer;backdrop-filter:blur(3px);
    transition:transform .12s,background .2s,border-color .2s;}
  .mode-card:active{transform:scale(.97);}
  .mode-card:hover{background:rgba(30,40,28,.5);border-color:#ffd98a;}
  .mode-icon{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,217,138,.7);
    display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18);line-height:0;align-self:center;}
  .mode-icon svg{width:24px;height:24px;display:block;}
  .mode-card > span:last-child{min-width:0;}
  .mode-card b{display:block;font-size:1rem;letter-spacing:.6px;overflow-wrap:break-word;}
  .mode-card span span{display:block;font-size:.74rem;opacity:.85;margin-top:3px;line-height:1.35;overflow-wrap:break-word;}
  .menu-foot{margin-top:14px;display:flex;gap:18px;align-items:center;}
  .linkish{background:none;border:none;color:#ffe6b0;font-size:.8rem;font-weight:700;letter-spacing:.5px;
    cursor:pointer;text-shadow:0 1px 4px rgba(0,0,0,.35);padding:8px;}
  .resume-bar{width:100%;margin-bottom:13px;}
  .resume-bar button{width:100%;}

  /* ---- journey ---- */
  header{display:flex;align-items:center;justify-content:space-between;z-index:3;
    padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left));}
  header .h-title{text-align:center;flex:1;min-width:0;}
  header h1{font-size:1.18rem;letter-spacing:2px;font-weight:700;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.55);}
  header .sub{font-size:.68rem;margin-top:2px;font-weight:700;letter-spacing:.4px;text-shadow:0 1px 6px rgba(0,0,0,.6);}
  .icon-btn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.4);
    color:#fbf7ee;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 44px;
    line-height:0;transition:background .2s;}
  .icon-btn:hover{background:rgba(0,0,0,.42);}
  .icon-btn svg{width:19px;height:19px;display:block;}
  .icon-btn .off-slash{display:none;}
  .icon-btn.muted .off-slash{display:block;}
  .icon-btn.muted .wave{opacity:.25;}

  /* quest map */
  .trail{position:relative;margin:6px auto 0;padding:0 10px;z-index:3;width:100%;max-width:560px;}
  .trail svg{width:100%;height:74px;display:block;overflow:visible;}
  #trailPath{fill:none;stroke:rgba(255,255,255,.4);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:.5 7;}
  #trailFill{fill:none;stroke:#ffd98a;stroke-width:3;stroke-linecap:round;
    filter:drop-shadow(0 0 4px rgba(255,217,138,.8));transition:stroke-dashoffset .9s ease;}
  .map-stop{fill:rgba(255,255,255,.35);stroke:rgba(255,255,255,.55);stroke-width:1.6;transition:fill .3s,stroke .3s;}
  .map-stop.done{fill:#ffd98a;stroke:#ffd98a;}
  .map-stop.current{fill:#fff;stroke:#ffd98a;stroke-width:2.4;}
  .map-tap{fill:transparent;cursor:pointer;}
  .map-star{fill:rgba(255,255,255,.5);font-size:15px;transition:fill .3s;text-anchor:middle;}
  .map-star.done,.map-star.current{fill:#ffd98a;filter:drop-shadow(0 0 5px rgba(255,217,138,.9));}
  #hiker{transition:transform .9s ease;}
  #hiker .dot{fill:#fff;stroke:#42301c;stroke-width:1.4;}
  #hiker .pulse{fill:none;stroke:rgba(255,255,255,.75);stroke-width:1.6;animation:pulse 2s ease-out infinite;}
  @keyframes pulse{0%{r:4;opacity:.9;}100%{r:12;opacity:0;}}

  .hint{text-align:center;font-size:.76rem;padding:2px 24px 4px;z-index:3;min-height:17px;
    color:#fdf9ef;text-shadow:0 1px 3px rgba(15,18,10,.85),0 0 12px rgba(15,18,10,.45);}

  .stage-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:2px 20px 8px;z-index:3;width:100%;min-height:0;}
  .chapter{font-size:.68rem;font-weight:800;letter-spacing:2.4px;margin-bottom:3px;text-align:center;
    color:#fdf9ef;text-shadow:0 1px 3px rgba(15,18,10,.85),0 0 12px rgba(15,18,10,.45);}
  .section-label{font-size:.98rem;font-weight:700;letter-spacing:.8px;color:#ffe6b0;margin-bottom:12px;text-align:center;
    text-shadow:0 1px 3px rgba(15,18,10,.85),0 0 14px rgba(15,18,10,.5);min-height:20px;
    font-family:'Iowan Old Style','Palatino','Georgia',serif;text-wrap:balance;}

  .card-wrap{width:100%;max-width:380px;height:52dvh;max-height:470px;min-height:300px;perspective:1500px;}
  .card{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .65s cubic-bezier(.4,.2,.2,1);cursor:pointer;outline:none;}
  .card:focus-visible{filter:drop-shadow(0 0 10px rgba(255,217,138,.9));}
  .card.finishCard{cursor:default;}
  .card.flipped{transform:rotateY(180deg);}
  .card.deal{animation:deal .5s ease;}
  @keyframes deal{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:22px;display:flex;flex-direction:column;
    box-shadow:0 20px 44px rgba(0,0,0,.4),0 2px 0 rgba(255,255,255,.15) inset;overflow:hidden;}
  .back{
    background:
      radial-gradient(circle at 50% 26%,rgba(255,217,138,.08),transparent 62%),
      linear-gradient(165deg,#34452f 0%,#243223 55%,#1c281d 100%);
    border:2px solid rgba(255,217,138,.45);
    align-items:center;justify-content:center;text-align:center;padding:30px 22px;}
  .back .topo{position:absolute;inset:0;width:100%;height:100%;}
  .back .topo path{fill:none;stroke:rgba(255,217,138,.12);stroke-width:1;}
  .bframe{position:absolute;inset:11px;border:1.5px solid rgba(255,217,138,.5);border-radius:14px;pointer-events:none;}
  .bframe::before{content:"";position:absolute;inset:4px;border:1px solid rgba(255,217,138,.22);border-radius:10px;}
  .bframe i{position:absolute;width:8px;height:8px;background:#22301f;border:1.5px solid rgba(255,217,138,.75);
    transform:rotate(45deg);left:50%;margin-left:-4px;}
  .bframe i.n{top:-5px;}
  .bframe i.s{bottom:-5px;}
  .bno{position:relative;font-size:.6rem;letter-spacing:3.2px;font-weight:800;
    color:rgba(255,230,176,.85);margin-bottom:15px;}
  .arch{position:relative;width:140px;height:160px;border:1.5px solid rgba(255,217,138,.75);
    border-radius:70px 70px 14px 14px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 38%,rgba(255,217,138,.1),rgba(0,0,0,.18) 78%);
    box-shadow:0 0 0 4px rgba(255,217,138,.07);margin-bottom:16px;}
  .arch::after{content:"";position:absolute;inset:6px;border:1px solid rgba(255,217,138,.25);
    border-radius:62px 62px 10px 10px;}
  .arch span{display:flex;align-items:center;justify-content:center;line-height:0;}
  .arch svg{width:76px;height:76px;display:block;}
  .back h2{position:relative;font-size:1.2rem;letter-spacing:1.4px;color:#ffd98a;
    font-family:'Iowan Old Style','Palatino','Georgia',serif;}
  .brule{position:relative;display:flex;align-items:center;gap:9px;margin:10px 0 8px;}
  .brule::before,.brule::after{content:"";width:36px;height:1px;background:rgba(255,217,138,.4);}
  .brule b{width:6px;height:6px;border:1px solid rgba(255,217,138,.75);transform:rotate(45deg);display:block;}
  .back p{position:relative;font-size:.8rem;opacity:.78;padding:0 26px;line-height:1.4;
    font-family:'Iowan Old Style','Palatino','Georgia',serif;font-style:italic;}
  .front{
    background:
      radial-gradient(circle at 18% 12%,rgba(200,116,59,.07),transparent 40%),
      radial-gradient(circle at 84% 90%,rgba(120,130,90,.08),transparent 45%),
      repeating-linear-gradient(0deg,rgba(120,100,60,.025) 0 2px,transparent 2px 4px),
      linear-gradient(170deg,#f7f1e3,#e7dcc3);
    border:2px solid #e7dcc3;
    transform:rotateY(180deg);padding:34px 26px;color:#33402f;
    align-items:center;justify-content:center;text-align:center;}
  .front .pin{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:.66rem;
    letter-spacing:2.4px;text-transform:uppercase;font-weight:800;color:#a85a28;}

  .front .tip{position:absolute;bottom:22px;left:24px;right:24px;font-size:.78rem;

  .corner.br{bottom:12px;right:12px;border-bottom:2px solid #c8743b;border-right:2px solid #c8743b;border-bottom-right-radius:8px;}

  .controls{display:flex;gap:10px;justify-content:center;align-items:center;
    padding:8px 16px calc(22px + env(safe-area-inset-bottom));z-index:3;flex-wrap:wrap;}

  .notes-empty{text-align:center;opacity:.85;font-size:.86rem;line-height:1.6;padding:30px 10px;text-shadow:0 1px 4px rgba(0,0,0,.3);}
  .notes-back{display:block;margin:8px auto 0;}

  /* small phones (iPhone SE, narrow Androids) */
  @media(max-width:374px){
    #menu h1{font-size:1.9rem;letter-spacing:3px;}
    .mode-card{padding:12px 13px;gap:11px;}

    .mode-card span span{font-size:.7rem;}
    .front{padding:30px 18px;}
    .front .q{font-size:1.16rem;}
    .front .tip{font-size:.72rem;left:18px;right:18px;}
    .controls{gap:7px;padding-left:10px;padding-right:10px;}
    .btn-primary{padding:13px 18px;font-size:.88rem;}
    .btn-ghost{padding:12px 13px;font-size:.78rem;}

    .arch{width:112px;height:128px;border-radius:56px 56px 12px 12px;}

  }
  @media(max-height:700px){

  @media(max-height:560px){

  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01s !important;animation-iteration-count:1 !important;}
    .card{transition:transform .25s;}
    .layer{transition:opacity .3s;}
    .orb .ball,.mtn,#trailFill,#hiker{transition:none;}
  }
</style>

const SECTIONS = [

  EM_OPEN+'<path d="M16 18 L7 34 H25 Z"/><path d="M16 28 L5 46 H27 Z"/><path d="M48 18 L39 34 H57 Z"/><path d="M48 28 L37 46 H59 Z"/><path d="M16 46 V52 M48 46 V52"/><path d="M28 56 q4 -10 8 -16" stroke-dasharray="2.5 4"/></svg>',

  EM_OPEN+'<path d="M8 26 q6 -5 12 0 t12 0 t12 0 t12 0"/><path d="M8 36 q6 -5 12 0 t12 0 t12 0 t12 0"/><path d="M8 46 q6 -5 12 0 t12 0 t12 0 t12 0"/><ellipse cx="20" cy="41" rx="5" ry="3"/><ellipse cx="34" cy="31" rx="5" ry="3"/><ellipse cx="46" cy="41" rx="5" ry="3"/></svg>',

  EM_OPEN+'<circle cx="32" cy="26" r="9"/><path d="M32 10 V14 M32 38 V42 M16 26 H12 M52 26 H48 M21 15 L18 12 M46 15 L43 12"/><path d="M6 50 H58"/><path d="M16 50 V44 M24 50 V46 M42 50 V45 M50 50 V47"/></svg>',

  EM_OPEN+'<path d="M22 44 A10 10 0 0 1 42 44"/><path d="M32 26 V20 M18 32 L13 27 M46 32 L51 27"/><path d="M4 44 H60"/><path d="M8 56 L20 48 L30 54 L44 46 L56 56"/></svg>',

  /* Summit: flag and stars */
  EM_OPEN+'<path d="M8 54 L32 14 L56 54"/><path d="M32 14 V4"/><path d="M32 5 L42 8.5 L32 12 Z"/><circle cx="12" cy="14" r="1.3" fill="#ffd98a"/><circle cx="52" cy="10" r="1.3" fill="#ffd98a"/><circle cx="44" cy="22" r="1.1" fill="#ffd98a"/></svg>'

/* trail definitions: which section + which sky stage at each stop */
const TRAILS = {
  full:  [{s:0,st:0},{s:1,st:1},{s:2,st:2},{s:3,st:3},{s:4,st:4},{s:5,st:5},{s:6,st:6},{s:7,st:7}],
  quick: [{s:0,st:0},{s:1,st:2},{s:2,st:4},{s:3,st:5},{s:7,st:7}]
};
const MODE_SUBS = { full:"Trailhead to summit", quick:"Quick check-in · 5 stops", campfire:"Around the fire · random draw" };

/* =================== STATE =================== */
const state = { mode:null, trail:TRAILS.full, t:0, stage:0, started:false, currentQ:"", drawn:0, campSec:0 };
const $ = id => document.getElementById(id);
const card = $('card');

/* =================== SCENERY =================== */
function buildTrees(){
  let d = "M0 90 L0 64 ";
  let x = 0;
  while(x < 1200){
    const w = 26 + Math.random()*30, h = 26 + Math.random()*34;
    d += "L"+(x+w*0.5).toFixed(0)+" "+(64-h).toFixed(0)+" L"+(x+w).toFixed(0)+" 64 ";
    x += w;
  }
  d += "L1200 90 Z";
  $('treePath').setAttribute('d', d);
}

function setScene(stage){
  state.stage = stage;
  const b = document.body;
  b.className = b.className.replace(/stage-\d+/g,'').replace(/\b(dim-stars|full-stars|mode-campfire)\b/g,'').trim();
  b.classList.add('stage-'+stage);
  if(stage===6) b.classList.add('dim-stars');
  if(stage===7) b.classList.add('full-stars');
  if(state.mode==='campfire') b.classList.add('mode-campfire');
  document.querySelectorAll('.layer').forEach((l,i)=>l.classList.toggle('active', i===stage));
  const THEME=['#bfc4ae','#a8bb8f','#92ad80','#83a78d','#a8965f','#b67a3c','#473a66','#141b33'];
  document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME[stage]);
  /* parallax: layers travel sideways as you climb */
  const px = state.mode==='campfire' ? 4 : state.t;
  $('mtnFar').style.transform   = 'translateX('+(-px*4)+'px)';
  $('mtnMid').style.transform   = 'translateX('+(-px*8)+'px)';
  $('mtnNear').style.transform  = 'translateX('+(-px*13)+'px)';
  $('mtnTrees').style.transform = 'translateX('+(-px*19)+'px)';
  Snd.setScene();
}

/* =================== QUEST MAP =================== */
let mapPts = [];
function buildMap(){
  const n = state.trail.length;
  const path = $('trailPath'), L = path.getTotalLength();
  const g = $('mapStops'); g.innerHTML = '';
  mapPts = [];
  const NS = 'http://www.w3.org/2000/svg';
  for(let i=0;i<n;i++){
    const p = path.getPointAtLength(L*i/(n-1));
    mapPts.push(p);
    if(i===n-1){
      const t = document.createElementNS(NS,'text');
      t.setAttribute('x',p.x); t.setAttribute('y',p.y+5);
      t.setAttribute('class','map-star'); t.textContent='★';
      g.appendChild(t);
    } else {
      const c = document.createElementNS(NS,'circle');
      c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r',5);
      c.setAttribute('class','map-stop');
      g.appendChild(c);
    }
    const tap = document.createElementNS(NS,'circle');
    tap.setAttribute('cx',p.x); tap.setAttribute('cy',p.y); tap.setAttribute('r',15);
    tap.setAttribute('class','map-tap');
    (function(i){ tap.addEventListener('click', function(){ jumpTo(i); }); })(i);
    g.appendChild(tap);
  }
  const fill = $('trailFill');
  fill.style.strokeDasharray = L;
  fill.style.strokeDashoffset = L;
}

function updateTrail(){
  const n = state.trail.length;
  const path = $('trailPath'), L = path.getTotalLength();
  const prog = (state.started && n>1) ? state.t/(n-1) : 0;
  $('trailFill').style.strokeDashoffset = L*(1-prog);
  const stops = $('mapStops').querySelectorAll('.map-stop,.map-star');
  stops.forEach((el,i)=>{
    el.classList.remove('done','current');
    if(i<state.t) el.classList.add('done');
    if(i===state.t && state.started) el.classList.add('current');
  });
  const p = mapPts[state.t] || mapPts[0];
  if(p) $('hiker').style.transform = 'translate('+p.x+'px, '+p.y+'px)';
}

function jumpTo(i){
  if(state.mode==='campfire' || card.classList.contains('finishCard') || i===state.t) return;
  state.started = true;
  goTo(i);
}

/* =================== GAME FLOW =================== */
function pick(arr, avoid){
  if(arr.length===1) return arr[0];
  let q; do{ q = arr[Math.floor(Math.random()*arr.length)]; }while(q===avoid);
  return q;
}

function sectionAt(){
  if(state.mode==='campfire') return SECTIONS[state.campSec];
  return SECTIONS[state.trail[state.t].s];
}

function chapterText(){
  if(state.mode==='campfire') return "AROUND THE FIRE · CARD "+state.drawn;
  if(state.mode==='quick') return "QUICK CHECK-IN · STOP "+(state.t+1)+" OF "+state.trail.length;
  return SECTIONS[state.trail[state.t].s].chapter;
}

function loadStop(deal){
  const s = sectionAt();
  state.currentQ = pick(s.questions, null);
  $('chapter').textContent = chapterText();
  $('sectionLabel').textContent = s.label;
  $('frontPin').textContent = s.name;
  $('question').textContent = state.currentQ;
  $('tip').textContent = s.tip;
  $('backTitle').textContent = s.name;
  const secIdx = state.mode==='campfire' ? state.campSec : state.trail[state.t].s;
  $('backEmblem').innerHTML = EMBLEMS[secIdx];
  if(state.mode==='campfire'){
    $('backNo').textContent = "DRAWN FROM THE DECK";
    $('backSub').textContent = "Tap to turn the card over";
  } else {
    $('backNo').textContent = "STOP N° "+(state.t+1)+" OF "+state.trail.length;
    $('backSub').textContent = "Tap to reveal the question";
  }
  if(state.mode==='campfire'){
    $('backBtn').disabled = false;
    $('backBtn').textContent = "End the night ★";
    $('nextBtn').textContent = "Draw next →";
  } else {
    $('backBtn').disabled = (state.t===0);
    $('backBtn').textContent = "← Back";
    $('nextBtn').textContent = (state.t===state.trail.length-1 ? "Summit ★" : "Next →");
  }
  card.setAttribute('aria-label','Question card for '+s.name+', face down. Activate to reveal.');
  if(deal){ card.classList.remove('deal'); void card.offsetWidth; card.classList.add('deal'); }
  saveSession();
}

function flip(){
  if(card.classList.contains('finishCard')) return;
  if(!state.started){
    state.started = true;
    loadStop(false); updateTrail();
  }
  card.classList.toggle('flipped');
  Snd.tick();
  const open = card.classList.contains('flipped');
  $('hint').textContent = open ? "Take your time. Tap the card to flip it back." : "Tap the card to reveal the question";
  card.setAttribute('aria-label', open ? 'Question: '+state.currentQ : 'Question card, face down. Activate to reveal.');
}

function reroll(){
  if(card.classList.contains('finishCard')) return;
  const s = sectionAt();
  state.currentQ = pick(s.questions, state.currentQ);
  if(!card.classList.contains('flipped')){ flip(); return; }
  const q = $('question');
  q.style.opacity = 0;
  setTimeout(()=>{ q.textContent = state.currentQ; q.style.opacity = 1;
    card.setAttribute('aria-label','Question: '+state.currentQ); }, 150);
  Snd.tick();
}

function goTo(i){
  state.t = i;
  card.classList.remove('flipped');
  $('hint').textContent = "Tap the card to reveal the question";
  setScene(state.trail[i].st);
  updateTrail();
  setTimeout(()=>{ loadStop(true); updateTrail(); }, 360);
}

function next(){
  if(card.classList.contains('finishCard')) return;
  if(state.mode==='campfire'){ drawCampfire(); return; }
  if(state.t >= state.trail.length-1){ showFinish(); return; }
  goTo(state.t+1);
}
function goBack(){
  if(card.classList.contains('finishCard')) return;
  if(state.mode==='campfire'){ showFinish(); return; }
  if(state.t<=0) return;
  goTo(state.t-1);
}

function drawCampfire(){
  const wasFlipped = card.classList.contains('flipped');
  state.campSec = Math.floor(Math.random()*SECTIONS.length);
  state.drawn++;
  card.classList.remove('flipped');
  setTimeout(()=>{ loadStop(true); }, wasFlipped ? 360 : 80);
}

/* =================== MODES / SCREENS =================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}

function startMode(mode, restore){
  state.mode = mode;
  state.trail = TRAILS[mode==='campfire' ? 'full' : mode];
  state.t = restore ? restore.t : 0;
  state.started = restore ? restore.started : false;
  state.drawn = 0;
  $('modeSub').textContent = MODE_SUBS[mode];
  $('trail').style.display = mode==='campfire' ? 'none' : '';
  resetCard();
  if(mode==='campfire'){
    state.campSec = Math.floor(Math.random()*SECTIONS.length);
    state.drawn = 1;
    state.started = true;
    setScene(7);
    $('hint').textContent = "Tap the card to draw from the deck";
    loadStop(true);
  } else {
    setScene(state.trail[state.t].st);
    buildMap();
    $('hint').textContent = "Tap the card to begin the climb";
    loadStop(true);
    updateTrail();
  }
  showScreen('journey');
  saveSession();
}

function resetCard(){
  card.classList.remove('finishCard','flipped');
  const backFace = card.querySelector('.back'); backFace.style.display = '';
  const front = card.querySelector('.front');
  front.style.transform = '';
  front.innerHTML = '<span class="corner tl"></span><span class="corner br"></span>'+
    '<div class="pin" id="frontPin"></div><p class="q" id="question" aria-live="polite"></p><div class="tip" id="tip"></div>';
  $('controls').innerHTML =
    '<button class="btn-ghost" onclick="goBack()" id="backBtn" aria-label="Previous stop">← Back</button>'+
    '<button class="btn-reroll" onclick="reroll()" id="rerollBtn" aria-label="Draw a different question">↻ Another</button>'+
    '<button class="btn-primary" onclick="next()" id="nextBtn" aria-label="Next stop">Next →</button>';
  card.tabIndex = 0;
}

function exitToMenu(){
  saveSession();
  refreshResume();
  state.mode = null;
  setSceneMenuKeepStage();
  showScreen('menu');
}
function setSceneMenuKeepStage(){
  document.body.classList.remove('mode-campfire');
  Snd.setScene();
}

/* =================== FINISH + PRAYER NOTES =================== */
const FINISH = {
  full:{ h:"You made it to the summit.",
    p:"You walked the whole trail with him — from how he's doing, through where God is at work, to how you can carry him.",
    it:"Before you head down: pray over him out loud, and hold onto the one thing he asked you to carry." },
  quick:{ h:"Check-in complete.",
    p:"Even a short trail tells you where a guy really is. You showed up, and that's most of it.",
    it:"Before you go: pray over him, and hold onto what he asked you to carry." },
  campfire:{ h:"The fire burns low.",
    p:"No agenda, no trail — just honest cards under the stars. That's where a floor becomes brothers.",
    it:"Before you turn in: pray over him, and hold onto what came up tonight." }
};

function showFinish(){
  Snd.chime();
  $('chapter').textContent = "";
  $('sectionLabel').textContent = "";
  $('hint').textContent = "";
  const f = FINISH[state.mode] || FINISH.full;
  $('controls').innerHTML = '<button class="btn-primary" onclick="restart()">Start a new climb</button>';
  card.classList.add('finishCard'); card.classList.remove('flipped');
  card.tabIndex = -1;
  card.querySelector('.back').style.display = 'none';
  const front = card.querySelector('.front');
  front.style.transform = 'none';
  front.innerHTML =
    '<div class="finish"><h2>'+f.h+'</h2><p>'+f.p+'</p><p class="it">'+f.it+'</p>'+
    '<div class="notebox">'+
      '<label for="noteName">His name</label>'+
      '<input id="noteName" name="hisName" autocomplete="off" spellcheck="false" placeholder="Who you climbed with…">'+
      '<label for="noteText">His prayer request</label>'+
      '<textarea id="noteText" name="prayerRequest" placeholder="What he asked you to pray for…"></textarea>'+
      '<button class="save-btn" id="saveNoteBtn" onclick="saveNote()">Save to prayer log</button>'+
    '</div></div>';
  if(state.mode!=='campfire'){
    document.querySelectorAll('.map-stop,.map-star').forEach(d=>{d.classList.remove('current');d.classList.add('done');});
    $('trailFill').style.strokeDashoffset = 0;
    const p = mapPts[mapPts.length-1];
    if(p) $('hiker').style.transform = 'translate('+p.x+'px, '+p.y+'px)';
  }
  clearSession();
}

function saveNote(){
  const name = $('noteName').value.trim();
  const note = $('noteText').value.trim();
  if(!name && !note) return;
  const notes = getNotes();
  notes.unshift({ name: name||"(no name)", note: note||"—", date: Date.now(), mode: state.mode });
  try{ localStorage.setItem('climb.notes', JSON.stringify(notes)); }catch(e){}
  const b = $('saveNoteBtn'); b.textContent = "Saved ✓"; b.disabled = true;
}

function getNotes(){
  try{ return JSON.parse(localStorage.getItem('climb.notes')||'[]'); }catch(e){ return []; }
}

function openNotes(){ renderNotes(); showScreen('notes'); }
function closeNotes(){ showScreen('menu'); }

function renderNotes(){
  const list = $('notesList');
  const notes = getNotes();
  if(!notes.length){
    list.innerHTML = '<div class="notes-empty">Nothing here yet.<br>Finish a climb and save what he asks you to pray for — it\'ll be kept here.</div>';
    return;
  }
  list.innerHTML = notes.map((n,i)=>{
    const d = new Date(n.date);
    const when = d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' +
      (n.mode==='quick'?'Quick check-in':n.mode==='campfire'?'Campfire':'Full climb');
    return '<div class="note-card"><div class="who">'+esc(n.name)+'</div>'+
      '<div class="when">'+when+'</div><div class="what">'+esc(n.note)+'</div>'+
      '<button class="note-del" onclick="delNote(this,'+i+')" aria-label="Delete note">×</button></div>';
  }).join('');
}
/* two-tap delete: first tap asks, second confirms (auto-cancels after 2.5s) */
function delNote(btn,i){
  if(!btn.classList.contains('confirm')){
    btn.classList.add('confirm');
    btn.textContent = "Delete?";
    btn.setAttribute('aria-label','Tap again to confirm delete');
    clearTimeout(btn._rv);
    btn._rv = setTimeout(()=>{ btn.classList.remove('confirm'); btn.textContent='×';
      btn.setAttribute('aria-label','Delete note'); }, 2500);
    return;
  }
  clearTimeout(btn._rv);
  const notes = getNotes(); notes.splice(i,1);
  try{ localStorage.setItem('climb.notes', JSON.stringify(notes)); }catch(e){}
  renderNotes();
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function restart(){
  clearSession();
  refreshResume();
  state.mode = null; state.t = 0; state.started = false;
  document.body.classList.remove('mode-campfire');
  setScene(0);
  showScreen('menu');
}

/* =================== SESSION (resume after closing) =================== */
function saveSession(){
  if(!state.mode || state.mode==='campfire') return;
  try{ localStorage.setItem('climb.session', JSON.stringify({mode:state.mode, t:state.t, started:state.started})); }catch(e){}
}
function clearSession(){ try{ localStorage.removeItem('climb.session'); }catch(e){} }
function getSession(){
  try{ return JSON.parse(localStorage.getItem('climb.session')||'null'); }catch(e){ return null; }
}
function refreshResume(){
  const s = getSession();
  const bar = $('resumeBar');
  if(s && s.started && TRAILS[s.mode] && TRAILS[s.mode][s.t]){
    bar.hidden = false;
    const sec = SECTIONS[TRAILS[s.mode][s.t].s];
    $('resumeBtn').textContent = "Resume — "+sec.name+" →";
  } else bar.hidden = true;
}
function resumeClimb(){
  const s = getSession();
  if(!s) return;
  startMode(s.mode, s);
  updateTrail();
}

/* =================== AMBIENT SOUND (Web Audio, all generated) =================== */
const Snd = {
  ctx:null, on:false, master:null, windGain:null, fireGain:null, noise:null, _t:null,
  ensure(){
    if(this.ctx) return true;
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return false;
    this.ctx = new C();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(this.ctx.destination);
    const sr = this.ctx.sampleRate, len = sr*2;
    const buf = this.ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this.noise = buf;
    /* wind bed */
    const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300; f.Q.value=.5;
    this.windGain = this.ctx.createGain(); this.windGain.gain.value=.14;
    src.connect(f); f.connect(this.windGain); this.windGain.connect(this.master); src.start();
    const lfo = this.ctx.createOscillator(), lg = this.ctx.createGain();
    lfo.frequency.value=.06; lg.gain.value=110;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    /* campfire bed: low flame rumble with flicker + soft ember hiss (silent until campfire mode) */
    this.fireGain = this.ctx.createGain(); this.fireGain.gain.value = 0;
    this.fireGain.connect(this.master);
    const fsrc = this.ctx.createBufferSource(); fsrc.buffer = buf; fsrc.loop = true;
    const fbp = this.ctx.createBiquadFilter(); fbp.type='bandpass'; fbp.frequency.value=170; fbp.Q.value=.7;
    const flut = this.ctx.createGain(); flut.gain.value=.7;
    fsrc.connect(fbp); fbp.connect(flut); flut.connect(this.fireGain); fsrc.start();
    const flfo = this.ctx.createOscillator(), flg = this.ctx.createGain();
    flfo.frequency.value=7.3; flg.gain.value=.25;
    flfo.connect(flg); flg.connect(flut.gain); flfo.start();
    const wob = this.ctx.createOscillator(), wg = this.ctx.createGain();
    wob.frequency.value=.4; wg.gain.value=2.4;
    wob.connect(wg); wg.connect(flfo.frequency); wob.start();
    const hsrc = this.ctx.createBufferSource(); hsrc.buffer = buf; hsrc.loop = true;
    const hp = this.ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5200;
    const hg = this.ctx.createGain(); hg.gain.value=.018;
    hsrc.connect(hp); hp.connect(hg); hg.connect(this.fireGain); hsrc.start();
    this.loop();
    return true;
  },
  loop(){
    const tick = () => {
      const fire = document.body.classList.contains('mode-campfire');
      if(this.on && this.ctx){
        if(fire){
          this.crackle();
          if(Math.random()<.1) this.cricket();
          if(Math.random()<.04) this.owl();
        } else {
          if(state.stage<=4 && Math.random()<.55) this.chirp();
          if(state.stage>=5) this.cricket();
          if(state.stage>=6 && Math.random()<.12) this.owl();
        }
      }
      this._t = setTimeout(tick, (this.on && fire) ? 160+Math.random()*380 : 2300+Math.random()*2800);
    };
    this._t = setTimeout(tick, 1000);
  },
  env(g, t, peak, dur){
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t+.015);
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  },
  chirp(){
    const t = this.ctx.currentTime;
    const n = 2+Math.floor(Math.random()*2);
    for(let i=0;i<n;i++){
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      const f0 = 2500+Math.random()*900;
      o.frequency.setValueAtTime(f0, t+i*.13);
      o.frequency.exponentialRampToValueAtTime(f0*.72, t+i*.13+.09);
      this.env(g, t+i*.13, .05, .12);
      o.connect(g); g.connect(this.master);
      o.start(t+i*.13); o.stop(t+i*.13+.14);
    }
  },
  cricket(){
    const t = this.ctx.currentTime;
    for(let i=0;i<5;i++){
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.frequency.value = 4300;
      this.env(g, t+i*.062, .02, .05);
      o.connect(g); g.connect(this.master);
      o.start(t+i*.062); o.stop(t+i*.062+.06);
    }
  },
  /* fire detail sounds: sharp snaps, double-snaps, and low log pops */
  crackle(){
    const t = this.ctx.currentTime, r = Math.random();
    if(r < .55){ this.snap(t, 0); }
    else if(r < .78){ this.snap(t, 0); this.snap(t, .05+Math.random()*.07); }
    else { this.pop(t); }
  },
  snap(t, off){
    const s = this.ctx.createBufferSource(); s.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type='highpass';
    f.frequency.value = 2400+Math.random()*2600;
    const g = this.ctx.createGain();
    this.env(g, t+off, .09+Math.random()*.12, .02+Math.random()*.05);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t+off, Math.random()*1.5); s.stop(t+off+.09);
  },
  pop(t){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    const f0 = 110+Math.random()*90;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0*.55, t+.07);
    this.env(g, t, .15, .09);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+.12);
  },
  owl(){
    const t = this.ctx.currentTime;
    [0, .5].forEach((off,i)=>{
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.frequency.setValueAtTime(i?302:338, t+off);
      o.frequency.linearRampToValueAtTime(i?282:318, t+off+.3);
      const v = this.ctx.createOscillator(), vg = this.ctx.createGain();
      v.frequency.value = 5.5; vg.gain.value = 6;
      v.connect(vg); vg.connect(o.frequency); v.start(t+off); v.stop(t+off+.5);
      g.gain.setValueAtTime(0, t+off);
      g.gain.linearRampToValueAtTime(.045, t+off+.08);
      g.gain.linearRampToValueAtTime(.0001, t+off+(i?.46:.34));
      o.connect(g); g.connect(this.master);
      o.start(t+off); o.stop(t+off+.55);
    });
  },
  tick(){
    if(!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=850;
    const g = this.ctx.createGain();
    this.env(g, t, .09, .07);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t, Math.random()); s.stop(t+.1);
  },
  chime(){
    if(!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    [659.25, 880].forEach((fr,i)=>{
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.frequency.value = fr;
      g.gain.setValueAtTime(0, t+i*.28);
      g.gain.linearRampToValueAtTime(.1, t+i*.28+.02);
      g.gain.exponentialRampToValueAtTime(.0001, t+i*.28+1.4);
      o.connect(g); g.connect(this.master);
      o.start(t+i*.28); o.stop(t+i*.28+1.6);
    });
  },
  setScene(){ /* wind picks up near the summit; fire bed fades in around the campfire */
    if(!this.ctx || !this.windGain) return;
    const fire = document.body.classList.contains('mode-campfire');
    const w = fire ? .05 : state.stage>=6 ? .2 : state.stage>=4 ? .16 : .12;
    const t = this.ctx.currentTime;
    this.windGain.gain.linearRampToValueAtTime(w, t+1.2);
    if(this.fireGain) this.fireGain.gain.linearRampToValueAtTime(fire ? .5 : 0, t+1.2);
  },
  toggle(){
    if(!this.ensure()) return;
    if(this.ctx.state==='suspended') this.ctx.resume();
    this.on = !this.on;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.linearRampToValueAtTime(this.on ? .85 : 0, t+.6);
    this.paint();
  },
  paint(){
    [$('sndBtn'),$('sndBtnMenu')].forEach(b=>{
      if(!b) return;
      b.classList.toggle('muted', !this.on);
      b.setAttribute('aria-pressed', this.on ? 'true' : 'false');
      b.setAttribute('aria-label', this.on ? 'Turn ambient sound off' : 'Turn ambient sound on');
    });
  }
};

/* =================== INPUT / A11Y =================== */
card.addEventListener('click', flip);
card.addEventListener('keydown', e=>{
  if(e.key==='Enter' || e.key===' '){ e.preventDefault(); flip(); }
});
document.addEventListener('keydown', e=>{
  if(!$('journey').classList.contains('active')) return;
  if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
  if(e.key==='ArrowRight') next();
  if(e.key==='ArrowLeft') goBack();
});

/* =================== BOOT =================== */
buildTrees();
setScene(0);
refreshResume();
Snd.paint();
</script>
